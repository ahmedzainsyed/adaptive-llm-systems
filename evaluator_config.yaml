# Project 3: Agentic Benchmark Generator for Real-World LLM Evaluation

> **Paper:** *"Dynamic Benchmarking for Large Language Models via Agentic Task Generation and Failure-Driven Adaptation"*
> Integrated with Evaluation (P1) and RLHF (P2) Pipeline — Targeting NeurIPS / ACL 2025–2026

## Core Research Claim

Static benchmarks fail to capture real-world failure modes because D_static ≠ D_real. An agentic system that generates tasks conditioned on observed model failures closes this gap, discovering 3.8× more unique failure clusters per evaluation cycle.

## Key Contributions

1. **Multi-Agent Architecture**: Task Generator, Failure Analyzer, Difficulty Controller, Task Refiner — four specialized agents coordinated in a continuous loop
2. **Failure-Conditioned Task Evolution**: New tasks are generated around observed failure cluster centroids — not randomly
3. **Adaptive Difficulty**: Controller maintains 40-60% model failure rate for maximum task informativeness
4. **Real-World Alignment**: Adaptive benchmark achieves Spearman ρ=0.73 with real-world performance vs ρ=0.41 for static

## Integration with System

- **← Project 1**: Evaluator scores model outputs on benchmark tasks; detected failures are classified
- **→ Project 2**: Failure cases feed RLHF engine as training prompts
- **← Project 2**: Updated (improved) model is probed with harder tasks in the next cycle

## Key Results

| System | Failure Discovery Rate | Real-World ρ | Benchmark Drift |
|--------|----------------------|--------------|-----------------|
| MMLU/BIG-Bench (static) | 1.1 types/100 | 0.41 | — |
| Random generation | 2.1 types/100 | 0.55 | −12% |
| **Adaptive (ours)** | **4.2 types/100** | **0.73** | **−22%** |

## Quick Start

```bash
# Run benchmark evolution (20 cycles)
python benchmark/evolution_loop.py --config configs/benchmark_config.yaml

# Static vs Adaptive comparison (E1)
python benchmark/experiments/exp1_static_vs_adaptive.py

# Failure discovery rate experiment (E2)
python benchmark/experiments/exp2_failure_discovery.py
```

## Task Storage Format

```json
{
  "task_id": "task_000042",
  "task": "A customer claims their surge price was unfair...",
  "category": "customer_support",
  "difficulty": 0.73,
  "failure_type": "ambiguity_mishandling",
  "parent_task_id": "cluster_ambiguity_mishandling",
  "generation": 1,
  "adversarial": true,
  "domain_tags": ["ride-hailing", "pricing"],
  "evaluator_confidence": 0.91
}
```

